version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-broker
    restart: unless-stopped
    ports:
      - "6389:6389"
    volumes:
      - redis_data:/data
      - ./logs/redis:/var/log/redis
    command: redis-server --loglevel verbose --logfile /var/log/redis/redis.log
    networks:
      - stream_network

  stream_receiver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream-receiver
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6389
      - REDIS_CHANNEL_PATTERN=camera_stream:*
      - SERVER_PORT=8000
      - UNSUBSCRIBE_DELAY=30
    depends_on:
      - redis
    volumes:
      - ./logs/stream_receiver:/app/logs
    networks:
      - stream_network

  # Optional: Camera publisher service for testing
  camera_publisher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camera-publisher
    restart: "no"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    command: ts-node test_camera_publisher.ts
    networks:
      - stream_network
    profiles:
      - testing

volumes:
  redis_data:

networks:
  stream_network:
    driver: bridge
