version: '3.8'

services:
  redis:
    image: docker.io/library/redis:alpine
    container_name: redis-broker
    ports:
      - "6379:6379"
    volumes:
      - /var/log/redis:/var/log/redis
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --loglevel verbose --logfile /var/log/redis/redis.log --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  stream-receiver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream_receiver
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL=camera_stream
      - FLASK_ENV=production
      - HOST=0.0.0.0
      - PORT=5000
      - MAX_VIEWERS=10
    volumes:
      - ./app/logs:/app/logs
    restart: unless-stopped

  # Camera client service (for Pi deployment)
  camera-client:
    build:
      context: .
      dockerfile: Dockerfile.camera
    container_name: camera_client
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CAMERA_CHANNEL=camera_stream
      - FRAME_WIDTH=480
      - FRAME_HEIGHT=320
      - FRAME_RATE=24
    devices:
      - /dev/video0:/dev/video0
    privileged: true  # Required for camera access on Pi
    restart: unless-stopped
    profiles:
      - camera  # Only run when specifically requested

volumes:
  redis_data:
    driver: local

networks:
  default:
    driver: bridge