services:
  ###########################################################
  # Redis message broker                                    #
  ###########################################################
  redis:
    image: redis:7-alpine
    container_name: redis-camera
    ports:
      - "6379:6379"
    volumes:
      - ./logs/redis:/var/log/redis
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - camera-network
    restart: unless-stopped

  ###########################################################
  # Express web server - stream receiver                    #
  ###########################################################
  # After this launches, webpage should be found on IP:5000 #
  # Relies on the Redis Server container to be on           #
  ###########################################################
  stream-receiver:
    image: benten559/stream-receiver:latest
    container_name: stream-receiver
    ports:
      - "5000:5000"
    volumes:
      - ${DATA_PATH:-./local_data}:/data 
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL_PATTERN=camera_stream:*
      - SERVER_PORT=5000
      - UNSUBSCRIBE_DELAY=30
      - FRAME_SAVE_PATH=/data/frames 
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - camera-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/camera/available"]
      interval: 30s
      timeout: 3s
      retries: 3

  ###########################################################
  # Python camera producer                                  #
  ###########################################################
  # Publishes the Redis stream with key "raspberrypi"       #
  # Needs to access host HW devices from container          #
  # This also means that it needs privledged context        #
  # Requires the Redis server to be on and in good state    #
  ###########################################################
  camera-producer:
    image: benten559/camera-producer:latest
    container_name: camera-producer
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CAMERA_ID=raspberrypi
      - WIDTH=1920
      - HEIGHT=1080
      - JPEG_QUALITY=85
    depends_on:
      redis:
        condition: service_healthy
    privileged: true
    devices:
      - /dev/video0:/dev/video0
      - "/dev/media0:/dev/media0"
      - "/dev/media1:/dev/media1" # Access to the ISP/Unicam pipeline
      - "/dev/dma_heap/system:/dev/dma_heap/system"
      - "/dev/dma_heap/linux,cma:/dev/dma_heap/linux,cma"
    volumes:
      - "/run/udev:/run/udev:ro" # Critical for libcamera device discovery
    networks:
      - camera-network
    restart: unless-stopped

networks:
  camera-network:
    driver: bridge
