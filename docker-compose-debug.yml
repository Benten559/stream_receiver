services:
  ###########################################################
  # Redis - Standard, but keeping ports open for external GUI
  ###########################################################
  redis:
    image: redis:7-alpine
    container_name: redis-camera-debug
    ports:
      - "6379:6379"
    volumes:
      - ./logs/redis:/var/log/redis
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - camera-network
    restart: unless-stopped

  ###########################################################
  # Express web server - DEBUG MODE
  ###########################################################
  stream-receiver:
    build: . # Tells compose to build from local Dockerfile
    container_name: stream-receiver-debug
    user: root # Allows you to install tools like 'procps' or 'vim' inside
    ports:
      - "5000:5000"
      - "9229:9229" # Node.js Inspect port for Chrome DevTools
    volumes:
      - ${DATA_PATH:-./local_data}:/data 
      - .:/app               # Bind mount source code
      - /app/node_modules    # Anonymous volume to protect container's modules
    environment:
      - NODE_ENV=development # Enables verbose logging
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL_PATTERN=camera_stream:*
      - SERVER_PORT=5000
      - FRAME_SAVE_PATH=/data/frames
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - camera-network
    command: npx nodemon
    # In debug, we want to stay alive even if the app crashes
    stdin_open: true
    tty: true
    restart: "no"
    healthcheck:
      disable: true # Disable healthcheck so it doesn't kill the container while debugging

  ###########################################################
  # Python camera producer - DEBUG MODE
  ###########################################################
  camera-producer:
    build: ../Stream4Pi # Update this path to your Python source folder
    container_name: camera-producer-debug
    privileged: true
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CAMERA_ID=raspberrypi
      - WIDTH=4056
      - HEIGHT=3040
      - L_WIDTH=1024
      - L_HEIGHT=768
      - ROT=90
      - FPS=30
      - JPEG_QUALITY=85
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
    volumes:
      - "/run/udev:/run/udev:ro"
      - ../Stream4Pi:/app     # Bind mount Python source
    devices:
      - /dev/video0:/dev/video0
      - "/dev/media0:/dev/media0"
      - "/dev/media1:/dev/media1"
      - "/dev/dma_heap/system:/dev/dma_heap/system"
      - "/dev/dma_heap/linux,cma:/dev/dma_heap/linux,cma"
    networks:
      - camera-network
    stdin_open: true
    tty: true
    restart: "no"

networks:
  camera-network:
    driver: bridge